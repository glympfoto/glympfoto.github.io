<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GlympFoto</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b0d;color:#e8e8ea;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0b0d}
  #panel{position:fixed;left:0;right:0;top:0;padding:12px 16px;font-size:14px;
    background:rgba(0,0,0,.78);display:block;text-align:center;line-height:1.6}
  #panel a{color:#9ecbff}
  #panel .btn{display:inline-block;margin:6px 4px 0;padding:8px 16px;border-radius:8px;
    background:#1f6feb;color:#fff;text-decoration:none;border:0;cursor:pointer;font-size:14px}
  #panel .btn.ghost{background:#30363d}
  #err{display:none;margin-top:8px;font-size:13px;opacity:.9}
  #err.show{display:block}
</style>
</head>
<body>
<iframe id="frame" title="GlympFoto" allow="camera; microphone; geolocation" referrerpolicy="no-referrer"></iframe>
<div id="panel">
  <div id="loading">Memuat GlympFoto…</div>
  <div id="err">
    <div>Server tidak merespons dalam 15 detik.</div>
    <div style="opacity:.85">Kemungkinan: HP server mati / Termux tertutup, funnel restart, atau jaringan kamu memblokir <code>ts.net</code> (coba data seluler / WiFi lain / VPN).</div>
    <div>
      <a id="direct" class="btn" href="#" target="_blank" rel="noopener">Buka langsung</a>
      <button id="retry" class="btn ghost" type="button">Coba lagi</button>
    </div>
  </div>
</div>
<script>
(function () {
  // Basis server asli (Tailscale Funnel, stabil per HP). Kalau URL ini berubah,
  // cukup ganti satu baris ini lalu push ulang.
  var BASE = 'https://tailscale-termux-3.taildcfa9a.ts.net';
  var path = location.pathname + location.search + location.hash;
  var target;

  // Viewer (/v/), shortlink (/s/), guest (/g) aman di-iframe -> address bar tetap domain.
  // Root (/) = halaman guest upload, jadi https://glympfoto.github.io langsung bisa dipakai publik tanpa /g.
  // Selain itu (mis. / admin) butuh cookie sesi -> redirect langsung agar login tidak diblokir third-party cookie.
  if (location.pathname === '/' || location.pathname === '/index.html') {
    target = BASE + '/g' + location.search + location.hash;
  } else if (/^\/(v|s|g)(\/|$)/.test(location.pathname)) {
    target = BASE + path;
  } else {
    location.replace(BASE + path);
    return;
  }

  var frame = document.getElementById('frame');
  var loading = document.getElementById('loading');
  var err = document.getElementById('err');
  var direct = document.getElementById('direct');
  var retry = document.getElementById('retry');
  direct.href = target;

  var loaded = false;
  var timer = setTimeout(function () {
    if (!loaded) {
      loading.style.display = 'none';
      err.className = 'show';
    }
  }, 15000);

  frame.onload = function () {
    loaded = true;
    clearTimeout(timer);
    document.getElementById('panel').style.display = 'none';
  };
  frame.onerror = function () {
    clearTimeout(timer);
    loading.style.display = 'none';
    err.className = 'show';
  };
  retry.onclick = function () {
    loaded = false;
    err.className = '';
    loading.style.display = 'block';
    frame.src = target + (target.indexOf('?') >= 0 ? '&' : '?') + 'retry=' + Date.now();
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!loaded) {
        loading.style.display = 'none';
        err.className = 'show';
      }
    }, 15000);
  };
  frame.src = target;
})();
</script>
</body>
</html>
